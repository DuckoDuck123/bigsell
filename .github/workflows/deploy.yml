name: Deploy to CloudBase Static Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TCB_ENV_ID: ${{ secrets.TCB_ENV_ID || 'simba1902-d0g7sxaya83b62541' }}
      TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID || secrets.TENCENTCLOUD_SECRETID }}
      TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY || secrets.TENCENTCLOUD_SECRETKEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p public
          rsync -av \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.DS_Store' \
            --exclude 'Agent.md' \
            --exclude 'README.md' \
            --exclude 'cloudbaserc.json' \
            --exclude 'node_modules' \
            --exclude 'public' \
            ./ public/

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Check CloudBase secrets
        run: |
          test -n "$TCB_SECRET_ID"
          test -n "$TCB_SECRET_KEY"
          test -n "$TCB_ENV_ID"

      - name: Login to CloudBase
        run: tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"

      - name: Clear old static files
        run: tcb hosting delete -e "$TCB_ENV_ID" --force

      - name: Deploy static files
        run: tcb hosting deploy ./public -e "$TCB_ENV_ID"
