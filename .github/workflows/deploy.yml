name: Deploy to CloudBase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TCB_ENV_ID: simba1902-d0g7sxaya83b62541
      CI: true
      COS_SDK_KEEPALIVE: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          rm -rf public
          mkdir -p public
          rsync -av \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.DS_Store' \
            --exclude 'Agent.md' \
            --exclude 'README.md' \
            --exclude 'cloudbaserc.json' \
            --exclude 'node_modules' \
            --exclude 'public' \
            ./ public/
          grep -n '"askingPrice": 1799' public/data/inventory.json

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli --loglevel=error

      - name: Login to CloudBase
        run: tcb login --apiKeyId "${{ secrets.TENCENTCLOUD_SECRETID }}" --apiKey "${{ secrets.TENCENTCLOUD_SECRETKEY }}"

      - name: Deploy to CloudBase static hosting
        run: tcb hosting deploy ./public / -e "$TCB_ENV_ID" --json
